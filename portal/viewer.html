<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>OAK Kundenportal — Dokument</title>
<link rel="stylesheet" href="portal.css">
<style>
  html,body{height:100%}
  body{display:flex;flex-direction:column;background:#e7efeb}
  .vkopf{background:#fff;border-bottom:3px solid var(--gruen);flex:0 0 auto;}
  .vkopf .wrap{display:flex;align-items:center;justify-content:space-between;padding:10px 18px;gap:12px;}
  .vkopf .titel{font-family:'Cormorant Garamond',serif;font-weight:700;font-size:20px;color:var(--dunkel);}
  .vkopf .typ{font-size:11px;letter-spacing:1.5px;text-transform:uppercase;color:var(--gruen);font-weight:600;}
  #rahmen{flex:1 1 auto;border:0;width:100%;background:#f3f7f5;}
  #ladehinweis{padding:40px;text-align:center;color:var(--grau);font-size:15px;}
</style>
</head>
<body>
<div class="vkopf"><div class="wrap">
  <div>
    <div class="typ" id="vTyp"></div>
    <div class="titel" id="vTitel">Dokument wird geladen …</div>
  </div>
  <a class="btn sek" href="index.html">← Übersicht</a>
</div></div>
<div id="ladehinweis">Dokument wird geladen …</div>
<iframe id="rahmen" class="hidden" title="Dokument"></iframe>

<script src="auth.js"></script>
<script src="viewer.js"></script>
</body>
</html>
