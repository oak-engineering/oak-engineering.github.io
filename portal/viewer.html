<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>OAK Kundenportal — Dokument</title>
<link rel="stylesheet" href="portal.css?v=202608141404">
<style>
  html,body{height:100%}
  body{display:flex;flex-direction:column;background:#e7efeb}
  .vkopf{background:#fff;border-bottom:3px solid var(--gruen);flex:0 0 auto;}
  .vkopf .wrap{display:flex;align-items:center;justify-content:space-between;padding:10px 18px;gap:12px;}
  .vkopf .titel{font-family:'Cormorant Garamond',serif;font-weight:700;font-size:20px;color:var(--dunkel);}
  .vkopf .typ{font-size:11px;letter-spacing:1.5px;text-transform:uppercase;color:var(--gruen);font-weight:600;}
  #rahmen{flex:1 1 auto;border:0;width:100%;background:#f3f7f5;}
  #ladehinweis{padding:40px;text-align:center;color:var(--grau);font-size:15px;}
  .save-badge{font-size:12.5px;font-weight:600;color:var(--gruen);background:var(--akzent);
    border:1px solid var(--hellgruen);border-radius:8px;padding:5px 10px;white-space:nowrap;}
  .save-badge.err{color:#c0392b;background:#fdecea;border-color:#e5b4ae;}
</style>
</head>
<body>
<div class="vkopf"><div class="wrap">
  <div>
    <div class="typ" id="vTyp"></div>
    <div class="titel" id="vTitel">Dokument wird geladen …</div>
  </div>
  <div style="display:flex;align-items:center;gap:10px">
    <span id="saveBadge" class="save-badge hidden"></span>
    <button class="btn sek hidden" id="logBtn" type="button">Bearbeitungslog</button>
    <a class="btn sek" href="index.html">← Übersicht</a>
  </div>
</div></div>
<div id="logModal" class="hidden" style="position:fixed;inset:0;background:rgba(10,22,16,.55);z-index:60;display:flex;align-items:center;justify-content:center;padding:20px">
  <div style="background:#fff;border-radius:14px;max-width:640px;width:100%;max-height:80vh;overflow:auto;padding:22px 24px">
    <div style="display:flex;align-items:baseline;justify-content:space-between;margin-bottom:12px">
      <h2 style="font-family:'Cormorant Garamond',serif;color:var(--dunkel);font-size:22px">Bearbeitungslog</h2>
      <button class="btn sek" id="logZu" type="button">Schließen</button>
    </div>
    <div id="logListe" style="font-size:13.5px;color:var(--text)">lädt …</div>
  </div>
</div>
<div id="ladehinweis">Dokument wird geladen …</div>
<iframe id="rahmen" class="hidden" title="Dokument"></iframe>

<script src="auth.js?v=2026-08-14"></script>
<script src="viewer.js?v=2026-08-14"></script>
</body>
</html>
