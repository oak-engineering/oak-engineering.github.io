Last nur bodenfrei anheben, niedriger Schwerpunkt.": {"en": "**Drive defensively**, raise the load only **just off the ground**, low centre of gravity.", "tr": "**Öngörülü sürün**, yükü yalnızca **yerden hafifçe** kaldırın, düşük ağırlık merkezi."}, "Angepasste Geschwindigkeit bei Kurven, Schienen (45°), Unebenheiten, Hindernissen.": {"en": "Adapted speed at **bends, rails (45°), uneven surfaces, obstacles**.", "tr": "**Virajlar, raylar (45°), engebeler, engellerde** uygun hız."}, "Hubgerüst zurückneigen, Last sichern.": {"en": "**Tilt the mast back**, secure the load.", "tr": "Direği **geriye yatırın**, yükü sabitleyin."}, "Wenn der Stapler kippt": {"en": "**If the truck tips over**", "tr": "**Forklift devrilirse**"}, "Rückhaltesystem schützt vor Folgeschäden – sitzen bleiben und festhalten!": {"en": "The restraint system protects against consequential injury – **stay seated and hold on!**", "tr": "Emniyet sistemi sonradan oluşacak zararlardan korur – **yerinizde kalın ve tutunun!**"}, "Gasbetriebene Stapler": {"en": "**Gas-powered trucks**", "tr": "**Gazlı forkliftler**"}, "Prüfen & Flüssiggas": {"en": "**Checking & LPG**", "tr": "**Kontrol ve LPG**"}, "Zustand prüfen, Flüssiggasanlage auf Leckagen prüfen – Brand- und Explosionsgefahr.": {"en": "Check condition, check the **LPG system for leaks** – **fire and explosion hazard**.", "tr": "Durumu kontrol edin, **LPG tesisatını sızıntıya karşı** kontrol edin – **yangın ve patlama tehlikesi**."}, "Flüssiggas ist schwerer als Luft – sinkt nach unten, sammelt sich in Vertiefungen.": {"en": "LPG is **heavier than air** – sinks down and collects in low spots.", "tr": "LPG **havadan ağırdır** – aşağı çöker ve çukurlarda birikir."}, "Betreiben & Abstellen": {"en": "**Operating & parking**", "tr": "**Çalıştırma ve park etme**"}, "In geschlossenen Räumen Zwangslüftung (CO!); abstellen nur über Erdgleiche und gut belüftet.": {"en": "In closed rooms **forced ventilation** (CO!); park only **above ground level** and well ventilated.", "tr": "Kapalı alanlarda **zorlamalı havalandırma** (CO!); yalnızca **zemin seviyesinin üstünde** ve iyi havalandırılan yerde park edin."}, "Gasflaschen wechseln": {"en": "**Changing gas cylinders**", "tr": "**Gaz tüplerini değiştirme**"}, "Gefahren: Brand/Explosion, Erfrierungen, Erstickung.": {"en": "Hazards: **fire/explosion**, **frostbite**, **suffocation**.", "tr": "Tehlikeler: **yangın/patlama**, **donma yanıkları**, **boğulma**."}, "Motor abstellen, Stapler sichern, PSA gegen Kälte tragen.": {"en": "Switch off the engine, secure the truck, wear **PPE against cold**.", "tr": "Motoru kapatın, forklifti emniyete alın, **soğuğa karşı KKD** giyin."}, "Flaschen nur im Freien über Erdgleiche und erst nach Schließen des Ventils ausbauen.": {"en": "Remove cylinders **only outdoors above ground level** and only after **closing the valve**.", "tr": "Tüpleri **yalnızca açık havada, zemin üstünde** ve ancak **valfi kapattıktan sonra** sökün."}, "Einbau liegend, Kragenöffnung nach unten; Absperrventil langsam öffnen.": {"en": "Install **lying down, collar opening facing down**; open the shut-off valve **slowly**.", "tr": "**Yatık, yaka açıklığı aşağı** bakacak şekilde takın; kesme valfini **yavaşça** açın."}, "Batteriebetriebene Stapler – Wechsel": {"en": "**Battery-powered trucks – changing**", "tr": "**Akülü forkliftler – değişim**"}, "Betriebsanleitung beachten, Stapler sichern.": {"en": "Observe the operating manual, secure the truck.", "tr": "Kullanım kılavuzuna uyun, forklifti emniyete alın."}, "Säurefeste PSA (Handschuhe, Schürze, Augenschutz) – Elektrolyt ist verdünnte Schwefelsäure.": {"en": "**Acid-resistant PPE** (gloves, apron, eye protection) – electrolyte is **diluted sulphuric acid**.", "tr": "**Aside dayanıklı KKD** (eldiven, önlük, göz koruması) – elektrolit **seyreltik sülfürik asittir**."}, "Abklemmen: zuerst Minus, dann Plus. Anklemmen: zuerst Plus, dann Minus.": {"en": "Disconnect: **minus** first, then plus. Connect: **plus** first, then minus.", "tr": "Sökme: önce **eksi**, sonra artı. Bağlama: önce **artı**, sonra eksi."}, "Batterie mit Hebezeug transportieren, gegen Verrutschen sichern, Pole fetten.": {"en": "Transport the battery with **lifting gear**, secure against slipping, grease the terminals.", "tr": "Aküyü **kaldırma aracıyla** taşıyın, kaymaya karşı sabitleyin, kutupları gresleyin."}, "Batterien laden": {"en": "**Charging batteries**", "tr": "**Akü şarjı**"}, "Rechtzeitig laden, nur passendes Ladegerät, Säuredichte prüfen.": {"en": "Charge in good time, only the **matching charger**, check acid density.", "tr": "Zamanında şarj edin, yalnızca **uygun şarj cihazı**, asit yoğunluğunu kontrol edin."}, "Beim Nachfüllen von Wasser Augenschutz tragen.": {"en": "Wear **eye protection** when topping up water.", "tr": "Su eklerken **göz koruması** takın."}, "Ladestation gut belüften – explosibles Wasserstoff-Luft-Gemisch!": {"en": "**Ventilate the charging area well** – **explosive hydrogen-air mixture!**", "tr": "Şarj istasyonunu **iyi havalandırın** – **patlayıcı hidrojen-hava karışımı!**"}, "Funken und Lichtbögen vermeiden, Pole fest und gefettet.": {"en": "**Avoid sparks and arcs**, terminals tight and greased.", "tr": "**Kıvılcım ve arklardan kaçının**, kutuplar sıkı ve gresli."}, "Gefährdungen durch Rauschmittel": {"en": "**Hazards from intoxicants**", "tr": "**Uyuşturucu/alkolden kaynaklı tehlikeler**"}, "Alkohol/Drogen: eingeschränktes Sehfeld, langsamere Reaktion, Müdigkeit → unsicheres Fahren.": {"en": "Alcohol/drugs: **reduced field of vision, slower reaction, fatigue** → unsafe driving.", "tr": "Alkol/uyuşturucu: **daralmış görüş alanı, yavaş tepki, yorgunluk** → güvensiz sürüş."}, "Wirkung von Alkohol": {"en": "**Effect of alcohol**", "tr": "**Alkolün etkisi**"}, "0,2 ‰: Konzentration sinkt · 0,5 ‰: kritische Grenze · 0,8 ‰: lange Reaktionszeit.": {"en": "**0.2 ‰**: concentration drops · **0.5 ‰**: critical limit · **0.8 ‰**: long reaction time.", "tr": "**‰0,2**: konsantrasyon düşer · **‰0,5**: kritik sınır · **‰0,8**: uzun tepki süresi."}, "1,0 ‰: Rauschstadium · ab 3,0 ‰: Lähmung lebenswichtiger Funktionen.": {"en": "**1.0 ‰**: intoxication begins · **from 3.0 ‰**: paralysis of vital functions.", "tr": "**‰1,0**: sarhoşluk başlar · **‰3,0'den itibaren**: hayati işlevlerin felci."}, "Vielen Dank!": {"en": "**Thank you!**", "tr": "**Teşekkürler!**"}, "Sicher unterwegs mit Flurförderzeugen": {"en": "Safe travels with industrial trucks", "tr": "Forkliftlerle güvenli yolculuk"}, "Bei Fragen an Schichtführer oder Arbeitssicherheit wenden.": {"en": "If you have questions, contact your shift supervisor or occupational safety.", "tr": "Sorularınız için vardiya amirine veya iş güvenliğine başvurun."}, "Arbeiten am Kran": {"en": "**Working with cranes**", "tr": "**Vinçle çalışma**"}, "ARBEITEN AM KRAN": {"en": "**WORKING WITH CRANES**", "tr": "**VİNÇLE ÇALIŞMA**"}, "Voraussetzungen & Pflichten": {"en": "**Requirements & duties**", "tr": "**Şartlar ve görevler**"}, "Mindestalter 18 Jahre (Ausnahme: Ausbildung unter Aufsicht).": {"en": "Minimum age **18 years** (exception: training under supervision).", "tr": "Asgari yaş **18** (istisna: gözetim altında eğitim)."}, "Körperlich und geistig geeignet sein.": {"en": "Be **physically and mentally suitable**.", "tr": "**Bedenen ve zihnen uygun** olun."}, "Unterwiesen, beauftragt und eingewiesen sein.": {"en": "Be **instructed, authorised and inducted**.", "tr": "**Eğitilmiş, görevlendirilmiş ve tanıtımı yapılmış** olun."}, "Betriebsanleitung (Hersteller) und Betriebsanweisung (Betreiber) beachten.": {"en": "Observe the **operating manual** (manufacturer) and **operating instruction** (operator).", "tr": "**Kullanım kılavuzuna** (üretici) ve **işletme talimatına** (işletmeci) uyun."}, "Der Kranführer trägt die Verantwortung für den sicheren Kranbetrieb.": {"en": "The crane operator bears the **responsibility** for safe crane operation.", "tr": "Vinç operatörü güvenli vinç işletiminden **sorumludur**."}, "Krantechnik – kurz erklärt": {"en": "**Crane technology – in brief**", "tr": "**Vinç tekniği – kısaca**"}, "Standsicherheit & Schwerpunkt beachten – Lasten pendeln und können kippen.": {"en": "Observe **stability & centre of gravity** – loads **swing** and can tip.", "tr": "**Devrilme dayanıklılığı ve ağırlık merkezine** dikkat edin – yükler **sallanır** ve devrilebilir."}, "Tragmittel (Lasthaken, Seil, Kette) sowie Sicherheitseinrichtungen und Bremsen kennen.": {"en": "Know the **load-bearing equipment** (hook, rope, chain) and **safety devices and brakes**.", "tr": "**Taşıma araçlarını** (kanca, halat, zincir) ve **güvenlik tertibatları ile frenleri** bilin."}, "Notendschalter begrenzen Endstellungen nur im Notfall – nicht als normale Endlage anfahren.": {"en": "**Emergency limit switches** limit end positions only in emergencies – do not approach as a normal end position.", "tr": "**Acil son şalterleri** son konumları yalnızca acil durumda sınırlar – normal son konum olarak kullanmayın."}, "Prüfungen vor Arbeitsbeginn": {"en": "**Checks before starting work**", "tr": "**İşe başlamadan önce kontroller**"}, "Sichtprüfung auf offensichtliche Mängel.": {"en": "**Visual check** for obvious defects.", "tr": "Belirgin kusurlar için **görsel kontrol**."}, "Steuerung und Bremse kontrollieren, Notendschalter prüfen.": {"en": "Check the **controls** and **brake**, test the **emergency limit switch**.", "tr": "**Kumandayı** ve **freni** kontrol edin, **acil son şalterini** test edin."}, "Tragmittel prüfen: Lasthaken, Hubseil, Hubketten.": {"en": "Check the **load-bearing equipment**: hook, hoist rope, hoist chains.", "tr": "**Taşıma araçlarını** kontrol edin: kanca, kaldırma halatı, kaldırma zincirleri."}, "Anschlagmittel auf Beschädigung und Tragfähigkeit prüfen.": {"en": "Check **slinging gear** for **damage and load capacity**.", "tr": "**Bağlama gereçlerini** **hasar ve taşıma kapasitesi** açısından kontrol edin."}, "Sicherer Kranbetrieb": {"en": "**Safe crane operation**", "tr": "**Güvenli vinç işletimi**"}, "Last bzw. Hakenflasche bei allen Bewegungen beobachten.": {"en": "**Watch the load or hook block during all movements.**", "tr": "**Tüm hareketlerde yükü veya kanca bloğunu gözleyin.**"}, "Bei fehlender Sicht nur auf Zeichen einer einweisenden Person steuern (Handzeichen).": {"en": "With no view, operate **only on signals from a banksman** (hand signals).", "tr": "Görüş yoksa **yalnızca yönlendiren kişinin işaretiyle** kullanın (el işaretleri)."}, "Im Gefahrfall Warnzeichen geben.": {"en": "Give a **warning signal in case of danger**.", "tr": "**Tehlike anında uyarı işareti** verin."}, "Steuereinrichtung im Handbereich halten, solange die Last hängt.": {"en": "**Keep the control device within reach as long as the load is suspended.**", "tr": "**Yük asılı olduğu sürece kumandayı el menzilinde tutun.**"}, "Anschlagen von Lasten": {"en": "**Slinging loads**", "tr": "**Yük bağlama**"}, "Last abschätzen, geeignete Anschlagmittel wählen, richtig anschlagen.": {"en": "**Estimate the load**, choose suitable **slinging gear**, **sling correctly**.", "tr": "**Yükü tahmin edin**, uygun **bağlama gereci** seçin, **doğru bağlayın**."}, "Von Hand angeschlagene Lasten erst auf eindeutiges Zeichen bewegen.": {"en": "Move manually slung loads only on a **clear signal**.", "tr": "Elle bağlanan yükleri yalnızca **net bir işaretle** hareket ettirin."}, "Unsachgemäß angeschlagene Lasten nicht befördern.": {"en": "**Do not move improperly slung loads.**", "tr": "**Hatalı bağlanmış yükleri taşımayın.**"}, "Schrägzug vermeiden, Schwerpunkt beachten, Anschlagmittel vor scharfen Kanten schützen.": {"en": "**Avoid side pull**, observe the centre of gravity, protect slinging gear from **sharp edges**.", "tr": "**Eğik çekmeden kaçının**, ağırlık merkezine dikkat edin, bağlama gereçlerini **keskin kenarlardan** koruyun."}, "Ablegereife von Anschlag- und Lastaufnahmemitteln beachten.": {"en": "Observe the **discard criteria** of slinging and load-handling equipment.", "tr": "Bağlama ve yük tutma gereçlerinin **kullanımdan kaldırma ölçütlerine** dikkat edin."}, "Verbote & Gefahren": {"en": "**Prohibitions & hazards**", "tr": "**Yasaklar ve tehlikeler**"}, "Keine Lasten über Personen hinwegfahren.": {"en": "**Do not move loads over people**.", "tr": "**Yükleri insanların üzerinden geçirmeyin**."}, "Keine Personen mit Last oder Lastaufnahmeeinrichtung befördern.": {"en": "**Do not carry people** with the load or load-handling device.", "tr": "Yük veya yük tutma aletiyle **insan taşımayın**."}, "Zulässige Tragfähigkeit nie überschreiten.": {"en": "**Never exceed the permissible load capacity.**", "tr": "**İzin verilen taşıma kapasitesini asla aşmayın.**"}, "Kein Schrägzug, kein Losreißen festsitzender Lasten.": {"en": "**No side pull**, no tearing loose of stuck loads.", "tr": "**Eğik çekme yok**, sıkışmış yükleri koparma yok."}, "Gefahren: Lastabsturz, Umkippen, Pendeln, Getroffenwerden.": {"en": "Hazards: **load drop, tipping over, swinging, being struck**.", "tr": "Tehlikeler: **yük düşmesi, devrilme, sallanma, çarpılma**."}, "Arbeiten im Freien": {"en": "**Working outdoors**", "tr": "**Açık havada çalışma**"}, "Bei Wind besondere Vorsicht – Kranarbeiten ggf. einstellen.": {"en": "Take special care in **wind** – **stop** crane work if necessary.", "tr": "**Rüzgarda** özel dikkat – gerekirse vinç çalışmasını **durdurun**."}, "Bei Außenaufstellung nach Arbeitsende Windsicherung einlegen.": {"en": "For outdoor installation, **engage the wind securing device** after work.", "tr": "Açık alan kurulumunda iş bitiminde **rüzgar emniyetini devreye alın**."}, "Störungen, Mängel & Wartung": {"en": "**Faults, defects & maintenance**", "tr": "**Arızalar, kusurlar ve bakım**"}, "Bei Mängeln, die die Betriebssicherheit gefährden: Kranbetrieb sofort einstellen.": {"en": "For defects that **endanger operational safety: stop crane operation immediately.**", "tr": "İşletme güvenliğini **tehlikeye atan kusurlarda: vinç işletimini derhal durdurun.**"}, "Vorgesetzte / Fachabteilung benachrichtigen.": {"en": "Notify the **supervisor / specialist department**.", "tr": "**Amiri / uzman bölümü** bilgilendirin."}, "Wartung und Instandsetzung nur durch Fachkräfte – nicht durch den Kranführer.": {"en": "**Maintenance and repair only by specialists** – not by the crane operator.", "tr": "**Bakım ve onarım yalnızca uzmanlar tarafından** – vinç operatörü tarafından değil."}, "Nach Arbeitsende & PSA": {"en": "**After work & PPE**", "tr": "**İş sonrası ve KKD**"}, "Nach Arbeitsende": {"en": "**After work**", "tr": "**İş bittikten sonra**"}, "Steuerung auf Nullstellung, Kranhaken lastfrei hochziehen, Netzschalter aus, ggf. Windsicherung.": {"en": "Controls to **zero position**, **raise the crane hook without load**, **mains switch off**, wind securing if needed.", "tr": "Kumanda **sıfır konumda**, **vinç kancasını yüksüz kaldırın**, **şebeke şalteri kapalı**, gerekirse rüzgar emniyeti."}, "Persönliche Schutzausrüstung": {"en": "**Personal protective equipment**", "tr": "**Kişisel koruyucu donanım**"}, "Sicherheitsschuhe, Handschuhe, bei Bedarf Schutzhelm.": {"en": "**Safety shoes, gloves**, hard hat if required.", "tr": "**Güvenlik ayakkabısı, eldiven**, gerekirse **baret**."}, "Regelwerk": {"en": "**Rules & regulations**", "tr": "**Mevzuat**"}, "Betriebsanleitung (Hersteller) und Betriebsanweisung (Betreiber).": {"en": "**Operating manual** (manufacturer) and **operating instruction** (operator).", "tr": "**Kullanım kılavuzu** (üretici) ve **işletme talimatı** (işletmeci)."}, "DGUV Vorschrift „Krane\" sowie „Winden, Hub- und Zuggeräte\".": {"en": "**DGUV Regulation “Cranes”** and “Winches, lifting and pulling devices”.", "tr": "**DGUV Yönetmeliği “Vinçler”** ve “Vinçler, kaldırma ve çekme cihazları”."}, "DGUV Regel 100-500 (Betreiben von Arbeitsmitteln, u. a. Anschlagmittel).": {"en": "**DGUV Rule 100-500** (use of work equipment, incl. slinging gear).", "tr": "**DGUV Kuralı 100-500** (iş ekipmanlarının kullanımı, bağlama gereçleri dahil)."}, "Krankontrollbuch führen; wiederkehrende Kranprüfung durch befähigte Person/Sachverständigen.": {"en": "Keep a **crane logbook**; recurring **crane inspection** by a competent person/expert.", "tr": "**Vinç kontrol defteri** tutun; yetkin kişi/uzman tarafından periyodik **vinç kontrolü**."}, "Sicher arbeiten am Kran": {"en": "Working safely with cranes", "tr": "Vinçle güvenli çalışma"}}</script>

function mdHtml(str,base,p){ p=p||{}; const parts=(str||'').split('**'); let h='';
  parts.forEach((seg,k)=>{ if(seg==='')return; const b=(k%2===1)||p.pb; const col=b?'#0A2A66':(p.pc?'#'+p.pc:'#222222');
    let s=`font-size:${pt(base)}px;color:${col};`; if(b)s+='font-weight:700;'; if(p.pi)s+='font-style:italic;'; if(p.pu)s+='text-decoration:underline;';
    h+=`<span style="${s}">${esc(seg)}</span>`; });
  return h; }

  const bold=r.b||p.pb, ital=r.i||p.pi, und=r.u||p.pu, col=bold?'0A2A66':(p.pc||r.c);

  return `<span style="${st}">${esc(r.t)}</span>`; }
function paraInner(p){

function paraHtml(p){

function videoEmbed(src){
  src=(src||'').trim(); if(!src) return '<div style="width:100%;height:100%;display:flex;align-items:center;justify-content:center;background:#0a1430;color:#cdd6ea;font-size:14px">Video-URL im Admin eintragen</div>';
  let m=src.match(/(?:youtube\.com\/.*[?&]v=|youtu\.be\/|youtube\.com\/embed\/)([\w-]{11})/);
  if(m) return `<iframe src="https://www.youtube.com/embed/${m[1]}" style="width:100%;height:100%;border:0" allow="fullscreen;encrypted-media" allowfullscreen></iframe>`;
  m=src.match(/vimeo\.com\/(?:video\/)?(\d+)/);
  if(m) return `<iframe src="https://player.vimeo.com/video/${m[1]}" style="width:100%;height:100%;border:0" allow="fullscreen" allowfullscreen></iframe>`;
  if(/\.(mp4|webm|ogg)(\?.*)?$/i.test(src)) return `<video controls playsinline src="${esc(src)}" style="width:100%;height:100%;background:#000"></video>`;
  return `<iframe src="${esc(src)}" style="width:100%;height:100%;border:0" allowfullscreen></iframe>`;
}

    const cc=panel.querySelector('#aFmtC'); cc.value='#'+((fp().pc)||'222222'); cc.oninput=e=>{ const v=e.target.value.replace('#',''); sel.paras.forEach(p=>p.pc=v); render(); };

  if(['arrow','brace','circle','line','triangle'].includes(sel.type)){ panel.querySelector('#aShCol').oninput=e=>{ sel.color=e.target.value.replace('#',''); render(); }; const rs=panel.querySelector('#aShRot'); rs.value=String(sel.rot||0); rs.onchange=e=>{ sel.rot=+e.target.value; render(); }; }
  if(sel.type==='pic') panel.querySelector('#aRepl').onchange=e=>{ const f=e.target.files[0]; if(!f)return; const r=new FileReader(); r.onload=()=>{ const key='user_'+(++imgCounter); IMG[key]=r.result; userImgs[key]=r.result; sel.file=key; sel.logo=false; render(); }; r.readAsDataURL(f); };
  if(sel.type==='link'){ panel.querySelector('#aLT').oninput=e=>{ if(!sel.label)sel.label={}; sel.label[lang]=e.target.value; render(); }; panel.querySelector('#aLU').oninput=e=>{ sel.url=e.target.value; if(selEl){const a=selEl.querySelector('a'); if(a)a.href=e.target.value;} }; }

  if(sel.type==='flip'){ panel.querySelector('#aFf').oninput=e=>{ sel.front=sel.front||{}; sel.front[lang]=e.target.value; render(); }; panel.querySelector('#aFb').oninput=e=>{ sel.back=sel.back||{}; sel.back[lang]=e.target.value; render(); }; }

    if(!sel.answers)sel.answers=(typeof sel.answer==='number'?[sel.answer]:[]);

    panel.querySelector('#aQbad').oninput=e=>{ sel.bad=sel.bad||{}; sel.bad[lang]=e.target.value; }; }
  if(sel.type==='hotspotimg'){ panel.querySelector('#aHimg').onchange=e=>{ const f=e.target.files[0]; if(!f)return; const r=new FileReader(); r.onload=()=>{ const key='user_'+(++imgCounter); IMG[key]=r.result; userImgs[key]=r.result; sel.file=key; render(); openPanel(); }; r.readAsDataURL(f); };
    panel.querySelector('#aHadd').onclick=()=>{ window.__addSpot=(window.__addSpot===sel?null:sel); openPanel(); };
    panel.querySelector('#aHhide').onchange=e=>{ sel.hidden=e.target.checked; render(); };
    (sel.spots||[]).forEach((p,i)=>{ panel.querySelector('#aHs'+i).oninput=e=>{ p.label=p.label||{}; p.label[lang]=e.target.value; }; panel.querySelector('#aHd'+i).onclick=()=>{ sel.spots.splice(i,1); render(); openPanel(); }; }); }
  if(sel.type==='imgpick'){ panel.querySelector('#ipQ').oninput=e=>{ sel.q=sel.q||{}; sel.q[lang]=e.target.value; render(); };
    (sel.options||[]).forEach((o,i)=>{ panel.querySelector('#ipCap'+i).oninput=e=>{ o.cap=o.cap||{}; o.cap[lang]=e.target.value; render(); };
      panel.querySelector('#ipImg'+i).onchange=e=>{ const f=e.target.files[0]; if(!f)return; const r=new FileReader(); r.onload=()=>{ const key='user_'+(++imgCounter); IMG[key]=r.result; userImgs[key]=r.result; o.file=key; render(); }; r.readAsDataURL(f); };
      panel.querySelector('#ipC'+i).onclick=()=>{ const p=sel.answers.indexOf(i); if(p>=0)sel.answers.splice(p,1); else sel.answers.push(i); render(); openPanel(); };
      panel.querySelector('#ipD'+i).onclick=()=>{ if(sel.options.length>2){ sel.options.splice(i,1); sel.answers=(sel.answers||[]).filter(a=>a!==i).map(a=>a>i?a-1:a); render(); openPanel(); } }; });

      panel.querySelector('#dmImg'+i).onchange=e=>{ const f=e.target.files[0]; if(!f)return; const r=new FileReader(); r.onload=()=>{ const key='user_'+(++imgCounter); IMG[key]=r.result; userImgs[key]=r.result; it.file=key; render(); }; r.readAsDataURL(f); };

function openQuestionPanel(q){
  let h=`<h4>Verständnisfrage bearbeiten · Sprache ${lang.toUpperCase()}</h4>`;
  h+=`<label>Kategorie</label><input id="qk" value="${escA(q.kick[lang]||'')}">`;
  h+=`<label>Frage</label><textarea id="qq" style="min-height:54px">${esc(q.q[lang]||'')}</textarea>`;
  if(q.type==='mc'){ q.options.forEach((o,i)=>{ h+=`<label>Antwort ${i+1}</label><div class="arow"><input id="qo${i}" value="${escA(o[lang]||'')}" style="flex:1"><button class="abtn" id="qc${i}" title="als richtig markieren" style="${i===q.answer?'background:#1c7a43':''}">✓</button></div>`; });
    h+=`<label>Feedback bei richtig</label><textarea id="qok">${esc(q.ok[lang]||'')}</textarea>`;
    h+=`<label>Feedback bei falsch</label><textarea id="qbad">${esc(q.bad[lang]||'')}</textarea>`;
  } else { h+=`<label>Auflösung (HTML erlaubt)</label><textarea id="qrev">${esc(q.reveal[lang]||'')}</textarea>`; }
  h+=`<label>Position</label><select id="qPos"><option value="end" ${(!(typeof q.after==='number'&&q.after<GEO.slides.length))?'selected':''}>am Ende (vor dem Nachweis)</option>`+GEO.slides.map((s,i)=>`<option value="${i}" ${q.after===i?'selected':''}>nach Folie ${i+1}${s.title?' – '+esc(String(s.title)).slice(0,22):''}</option>`).join('')+`</select>`;
  h+=`<button class="abtn" id="qApply" style="margin-top:12px;width:100%">Frage übernehmen</button>`;
  h+=`<button class="abtn warn" id="qDel" style="margin-top:8px;width:100%">🗑 Frage löschen</button>`;
  panel.innerHTML=h; panel.classList.add('on'); fitPanel();
  if(q.type==='mc') q.options.forEach((o,i)=>{ panel.querySelector('#qc'+i).onclick=()=>{ q.answer=i; q.options.forEach((_,j)=>panel.querySelector('#qc'+j).style.background=(j===i?'#1c7a43':'')); }; });
  panel.querySelector('#qApply').onclick=()=>{ q.kick[lang]=panel.querySelector('#qk').value; q.q[lang]=panel.querySelector('#qq').value;
    if(q.type==='mc'){ q.options.forEach((o,i)=>o[lang]=panel.querySelector('#qo'+i).value); q.ok[lang]=panel.querySelector('#qok').value; q.bad[lang]=panel.querySelector('#qbad').value; }
    else q.reveal[lang]=panel.querySelector('#qrev').value;
    answered[pos]=undefined; flash('Frage übernommen ✓'); render(); };
  panel.querySelector('#qPos').onchange=e=>{ const v=e.target.value; q.after=(v==='end')?9999:(+v); rebuildSteps(); const np=STEPS.findIndex(s=>s.t==='q'&&s.q===q); if(np>=0)pos=np; render(); };
  panel.querySelector('#qDel').onclick=()=>{ if(!confirm('Diese Verständnisfrage löschen?'))return; const ix=QUESTIONS.indexOf(q); if(ix>=0)QUESTIONS.splice(ix,1); rebuildSteps(); if(pos>STEPS.length-1)pos=STEPS.length-1; if(STEPS[pos]&&STEPS[pos].t!=='slide'){ const f=STEPS.map((s,k)=>[s,k]).reverse().find(([s])=>s.t==='slide'); if(f)pos=f[1]; } sel=null; panel.classList.remove('on'); render(); flash('Frage gelöscht'); };
}
function exportHtml(){ const clone=document.documentElement.cloneNode(true);
  clone.querySelector('#geo').textContent=JSON.stringify({sw:GEO.sw,sh:GEO.sh,slides:GEO.slides});
  clone.querySelector('#img').textContent=JSON.stringify(IMG);
  clone.querySelector('#trans').textContent=JSON.stringify(TRANS);
  clone.querySelector('#quiz').textContent=JSON.stringify(QUESTIONS);
  const dk=clone.querySelector('#deck'); if(dk)dk.innerHTML='';
  clone.querySelectorAll('.adminbar,.apanel,#adminGear,.amenu,#gateHint').forEach(x=>x.remove());
  let html='<!DOCTYPE html>\n'+clone.outerHTML;
  html=html.replace("const BUILDVER='"+BUILDVER+"'","const BUILDVER='exp"+Date.now()+"'");
  const fn=(decodeURIComponent((location.pathname.split('/').pop()||'')).split('?')[0])||'unterweisung.html';
  const a=document.createElement('a'); a.href=URL.createObjectURL(new Blob([html],{type:'text/html'})); a.download=/\.html?$/i.test(fn)?fn:'unterweisung.html'; a.click(); flash('Exportiert: '+GEO.slides.length+' Folien ✓ (Version aktualisiert)'); }

render();
</script>
