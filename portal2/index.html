<!doctype html>
<html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>OAK EHS-Cockpit</title>
<link rel="stylesheet" href="as.css?v=2026-10-19s">

<meta name="theme-color" content="#2D6A4F">
<link rel="icon" href="../portal/icons/portal-192.png">

<div id="loginView" class="login-wrap" hidden>
  <form class="login" id="loginForm" autocomplete="on">
    <h1>OAK EHS-Cockpit</h1>
    <p>Anmeldung mit dem Zugang zum OAK-Kundenportal.</p>
    <label>E-Mail<input type="email" id="loginMail" autocomplete="username" required></label>
    <label>Passwort<input type="password" id="loginPw" autocomplete="current-password" required></label>
    <button class="btn" type="submit">Anmelden</button>
    <div class="fehler" id="loginFehler"></div>
  </form>
</div>
<div id="appView" hidden>
  <header class="kopf">
    <div class="marke">OAK <span>EHS-Cockpit</span></div>
    <button type="button" class="kopf-kontext" id="kopfKontext" title="Betrieb und Bereich wechseln"></button>
    <div class="kopf-rechts">
      <button type="button" class="kopf-icon" id="suchKnopf" aria-label="Suchen" title="Suchen ( / )"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="6.5"/><path d="m16 16 4.5 4.5"/></svg></button>
      <button type="button" class="kopf-icon" id="kopfMenueKnopf" aria-label="Menü" title="Betrieb, Bereich, Konto" aria-expanded="false"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7h16M4 12h16M4 17h16"/></svg></button>
      <span class="kopf-logo" id="kopfLogo"></span>
    </div>
    <div class="kopf-menue" id="kopfMenue" hidden>
      <div class="km-titel">Betrieb und Bereich</div>
      <div class="kunde-wahl" id="kundeWahl"></div>
      <div class="km-titel">Angemeldet</div>
      <div class="ich"><span id="ichName"></span><button class="link" id="abmelden">Abmelden</button></div>
    </div>
  </header>
  <div class="rumpf">
    <nav class="seitenleiste" id="nav"></nav>
    <main id="haupt"></main>
  </div>
  <div class="unterleiste"><button id="menueKnopf">☰ <span id="menueTitel">Bereiche</span></button></div>
  <div class="blatt-hg" id="blattHg"><div class="blatt" id="blatt"></div></div>
</div>
<dialog id="dlg" class="dlg"></dialog>
<div id="meldung" class="meldung" hidden></div>
