<!doctype html>
<html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<title>OAK Sicherheitskultur</title>
<meta name="description" content="Rundgänge zur Sicherheitskultur – anmelden, Gruppe sehen, Rundgänge planen und nachweisen. Demo ohne Anmeldung.">
<link rel="icon" href="../portal/icons/portal-192.png">
<link rel="stylesheet" href="../portal2/as.css?v=2026-11-06prof2">
<style>
/* Kalender-Raster wie im Cockpit (nur für die Verwaltung) */
.sv-pill{background:#fff;color:var(--blau);border:1px solid var(--linie);border-radius:16px;padding:4px 12px;font-size:13px;cursor:pointer}
.sv-pill.an{background:var(--blau);color:#fff;border-color:var(--blau)}
.sv-raster{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px}
.sv-wt{font-size:12px;color:var(--grau);text-align:center;font-weight:600;padding:2px 0}
.sv-tag{background:#fff;border:1px solid var(--linie);border-radius:8px;min-height:86px;padding:4px;font-size:12px;overflow:hidden}
.sv-tag.fremd{opacity:.45}.sv-tag.heute{border:2px solid var(--blau)}
.sv-nr{font-weight:600;color:var(--grau)}
.sv-e{display:block;width:100%;text-align:left;border:0;border-left:3px solid #c5ced8;border-radius:4px;padding:2px 4px;margin-top:2px;font-size:11px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;cursor:pointer;background:#eef1f5;color:var(--text)}
.sv-e.rot{border-left-color:var(--rot);background:var(--rot2)}.sv-e.gelb{border-left-color:var(--gelb);background:var(--gelb2)}.sv-e.gruen{border-left-color:var(--gruen);background:var(--gruen2)}
.sv-mkopf{display:flex;align-items:center;gap:8px;margin-bottom:8px}.sv-mkopf h2{margin:0;flex:1;font-size:16px;color:var(--blau)}
@media(max-width:600px){.sv-tag{min-height:58px;padding:2px}.sv-e{font-size:10px;padding:1px 2px}
  .reiter{display:grid!important;grid-auto-flow:column;grid-auto-columns:minmax(0,1fr);gap:4px}.reiter button{font-size:12px;padding:0 4px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0}}

/* Rahmen */
body{display:flex;flex-direction:column;min-height:100vh}
.sk-kopf{background:#fff;border-bottom:3px solid var(--blau);display:flex;align-items:center;gap:12px;padding:8px 16px;height:64px;flex:none}
.sk-marke{display:flex;align-items:center;gap:10px;min-width:0}
.sk-marke img{height:40px;width:auto}
.sk-marke b{font-family:'Cormorant Garamond',Georgia,serif;font-size:23px;font-weight:600;color:var(--blau-tief);white-space:nowrap}
.sk-marke small{display:block;font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:var(--grau)}
.sk-kopf a{margin-left:auto;color:var(--blau);font-size:14px}
.sk-haupt{flex:1;padding:24px 16px;display:flex;flex-direction:column}
#haupt{flex:1;display:flex;flex-direction:column}
.sk-fuss{flex:none;padding:12px 16px 16px;font-size:12px;color:var(--grau);display:flex;gap:6px 14px;flex-wrap:wrap}
.sk-fuss a{color:var(--grau)}

/* Startseite */
.sk-start{flex:1;display:grid;grid-template-columns:minmax(0,1.2fr) minmax(0,1fr);gap:32px;align-items:center}
.sk-intro h1{font-family:'Cormorant Garamond',Georgia,serif;font-weight:600;color:var(--blau-tief);font-size:44px;line-height:1.1;margin:0 0 14px}
.sk-intro p{font-size:17px;line-height:1.5;color:var(--text);margin:0 0 22px}
.sk-kacheln{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.sk-kachel{background:var(--blau2);border-radius:14px;padding:16px 18px;display:flex;flex-direction:column;gap:6px}
.sk-kachel b{font-family:'Cormorant Garamond',Georgia,serif;font-size:22px;font-weight:600;color:var(--blau-tief)}
.sk-kachel span{font-size:14px;line-height:1.45;color:var(--text)}
.sk-karte{background:#fff;border-radius:16px;box-shadow:0 4px 20px rgba(27,67,50,.08);padding:22px 24px;display:flex;flex-direction:column;gap:12px;min-width:0}
.sk-karte h2{font-family:'Cormorant Garamond',Georgia,serif;font-weight:600;font-size:26px;color:var(--blau-tief);margin:0}
.sk-form label{display:flex;flex-direction:column;gap:4px;font-size:13px;color:var(--grau)}
.sk-form input,.sk-form select{height:44px;font-size:15px;border-radius:10px}
.sk-rolle-titel{font-size:13px;color:var(--grau);margin-top:2px}
.sk-rollen{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.sk-rolle{position:relative;cursor:pointer}
.sk-rolle input{position:absolute;opacity:0;pointer-events:none}
.sk-rolle span{display:flex;align-items:center;justify-content:center;text-align:center;height:52px;padding:0 8px;border:1.5px solid var(--linie);border-radius:12px;font-size:14px;line-height:1.2;color:var(--text);background:#fff;hyphens:manual}
.sk-rolle input:checked+span{border-color:var(--blau);background:var(--blau2);color:var(--blau-tief);font-weight:600}
.sk-rolle input:focus-visible+span{outline:2px solid var(--blau-hell)}
.sk-los{height:48px;font-size:16px;justify-content:center;border-radius:24px;margin-top:4px}

/* Meine Seite */
.sk-mein h1{font-family:'Cormorant Garamond',Georgia,serif;font-weight:600;color:var(--blau-tief);font-size:40px;margin:0}
.sk-unter{color:var(--grau);margin:4px 0 22px;font-size:15px}
.sk-karten{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:18px;align-items:stretch}
.sk-karten .sk-karte{min-height:300px}
.sk-gross{font-size:20px;font-weight:600;color:var(--blau)}
.sk-liste{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:2px}
.sk-liste li{display:flex;justify-content:space-between;gap:10px;padding:7px 0;border-bottom:1px solid var(--linie);font-size:15px;min-width:0}
.sk-liste li span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sk-liste li small{color:var(--grau);font-size:13px;white-space:nowrap}
.sk-liste li.sk-ich span{font-weight:600}
.sk-leer{color:var(--grau);font-size:15px;line-height:1.45;margin:0}
.sk-unten{margin-top:auto;height:44px;justify-content:center;border-radius:22px;font-size:15px}

@media(max-width:900px){
  .sk-start{grid-template-columns:1fr;gap:18px;align-items:start}
  .sk-intro h1{font-size:30px;margin-bottom:8px}.sk-intro p{font-size:15px;margin-bottom:12px}
  .sk-kachel{padding:10px 12px}.sk-kachel b{font-size:18px}.sk-kachel span{font-size:12.5px}
  .sk-karte{padding:16px;gap:10px}.sk-karte h2{font-size:22px}
  .sk-karten{grid-template-columns:1fr;gap:12px}.sk-karten .sk-karte{min-height:0}
  .sk-mein h1{font-size:30px}.sk-unter{margin-bottom:14px}
}
@media(max-width:600px){
  .sk-kopf{height:56px}.sk-marke img{height:32px}.sk-marke b{font-size:19px}
  .sk-haupt{padding:14px 16px}
  .sk-intro p{display:none}
  .sk-form input,.sk-form select{height:40px}
  .sk-rolle span{height:46px;font-size:12.5px;padding:0 4px}
  .sk-liste li{padding:4px 0;font-size:14px}
  .sk-karten{gap:10px}.sk-karten .sk-karte{padding:12px 16px;gap:6px}.sk-karten .sk-karte h2{font-size:19px}.sk-gross{font-size:17px}
  .sk-mein h1{font-size:26px}.sk-unter{margin:2px 0 10px;font-size:14px}.sk-leer{font-size:14px}
}
</style>
</head><body>
<header class="sk-kopf">
  <div class="sk-marke"><img src="../assets/oak-logo.png" alt="OAK engineering"><div><b>OAK Sicherheitskultur</b><small>OAK engineering</small></div></div>
  <a href="#" id="skAb" hidden>Abmelden</a>
  <a href="#" id="skZurueck" hidden>‹ Zurück</a>
</header>
<main class="sk-haupt"><div id="haupt"></div></main>
<footer class="sk-fuss">
  <span>Demo – Eingaben bleiben nur in Ihrem Browser</span>
  <a href="#" id="skVerw">Für Verantwortliche: Verwaltung ansehen</a>
  <a href="#" id="skReset">Demo zurücksetzen</a>
  <a href="../impressum.html">Impressum</a><a href="../datenschutz.html">Datenschutz</a>
</footer>
<dialog id="dlg" class="dlg"></dialog>

</body></html>
